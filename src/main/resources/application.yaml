server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASS:Admin1234!}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    # Evita logs irrelevantes de Spring Security
    org.springframework.security: INFO

app:
  jwt:
    # Usa variable de entorno si existe; si no, aplica un valor por defecto
    secret: ${JWT_SECRET:secret-demo-1234567890-012345678901234567890}
    expiration: 3600 # 1 hora

  admin:
    name: "Admin Biblioteca"
    email: "admin@biblioteca.cl"
    password: ${ADMIN_PASSWORD:Admin123!}
