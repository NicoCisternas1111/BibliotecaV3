spring:
  datasource:
    url: jdbc:mysql://localhost:3306/biblioteca?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASS:Admin123!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si YA tienes tablas creadas y quieres “anclar” el estado actual por única vez:
    # baseline-on-migrate: true
    # baseline-version: 0

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-esta-es-una-clave-larga-de-ejemplo-123456}
    expiration: ${JWT_EXP_MINUTES:60}

  admin:
    name: ${APP_ADMIN_NAME:Admin}
    email: ${APP_ADMIN_EMAIL:admin@demo.cl}
    password: ${APP_ADMIN_PASSWORD:Admin123!}

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  use-fqn: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "never"
