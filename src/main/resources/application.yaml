spring:
  datasource:
    url: jdbc:mysql://localhost:3306/biblioteca?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASS:Admin123!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true 
    baseline-version: 0

server:
  port: 8080

app:
  jwt:
    secret: "clave-super-larga-para-jwt-que-no-va-en-github"
    expiration: 60   # minutos

  admin:
    name: "Admin Biblioteca"
    email: "admin@biblioteca.cl"
    password: "Admin123!"

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  use-fqn: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "never"
